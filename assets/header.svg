<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ced2711</title>
  <desc id="desc">A purple futuristic banner with rotating lines about building playful and intelligent software.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f" />
      <stop offset="0.55" stop-color="#100a20" />
      <stop offset="1" stop-color="#07070d" />
    </linearGradient>

    <linearGradient id="name-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2eaff" />
      <stop offset="0.45" stop-color="#c39cff" />
      <stop offset="1" stop-color="#8656ff" />
    </linearGradient>

    <linearGradient id="edge-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a970ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#a970ff" />
      <stop offset="1" stop-color="#a970ff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-a">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.36" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-b">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.2" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b892ff" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="phrase-one">
      <rect x="38" y="140" width="700" height="42">
        <animate attributeName="width" values="0;700;700;0;0" keyTimes="0;0.08;0.25;0.32;1" dur="15s" begin="-1.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="phrase-two">
      <rect x="38" y="140" width="0" height="42">
        <animate attributeName="width" values="0;0;700;700;0;0" keyTimes="0;0.33;0.41;0.58;0.65;1" dur="15s" begin="-1.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="phrase-three">
      <rect x="38" y="140" width="0" height="42">
        <animate attributeName="width" values="0;0;700;700;0;0" keyTimes="0;0.66;0.74;0.91;0.98;1" dur="15s" begin="-1.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @keyframes drift-a { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(42px, 18px); } }
      @keyframes drift-b { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-34px, -12px); } }
      @keyframes scan { from { transform: translateY(-110px); } to { transform: translateY(470px); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      .orb-a { animation: drift-a 11s ease-in-out infinite; }
      .orb-b { animation: drift-b 14s ease-in-out infinite; }
      .scan { animation: scan 9s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .orb-a, .orb-b, .scan, .pulse, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#background)" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="356" rx="23" fill="url(#grid)" />

  <circle class="orb-a" cx="210" cy="40" r="300" fill="url(#glow-a)" />
  <circle class="orb-b" cx="1050" cy="315" r="340" fill="url(#glow-b)" />

  <g opacity="0.65">
    <circle class="pulse" cx="1030" cy="78" r="3" fill="#c4a7ff" />
    <circle class="pulse" cx="1100" cy="125" r="2" fill="#e879f9" style="animation-delay: .8s" />
    <circle class="pulse" cx="960" cy="245" r="2.5" fill="#a78bfa" style="animation-delay: 1.4s" />
    <circle class="pulse" cx="1130" cy="290" r="2" fill="#d8b4fe" style="animation-delay: 2s" />
  </g>

  <rect class="scan" x="28" y="0" width="1144" height="1" fill="url(#edge-gradient)" opacity="0.5" />

  <g transform="translate(78 68)">
    <path d="M0 16V0h16M1028 0h16v16M0 206v16h16M1028 222h16v-16" fill="none" stroke="#a970ff" stroke-opacity="0.45" stroke-width="2" />

    <text x="0" y="88" class="sans" font-size="74" font-weight="750" letter-spacing="-2" fill="url(#name-gradient)" filter="url(#text-glow)">ced2711</text>
    <text x="4" y="122" class="mono" font-size="13" letter-spacing="3" fill="#a78bfa">INDEPENDENT BUILDER // SIGNAL ACTIVE</text>

    <text x="4" y="173" class="mono" font-size="24" fill="#9f7aea">&gt;</text>
    <text x="38" y="173" class="mono" font-size="24" fill="#e9ddff" clip-path="url(#phrase-one)">building strange little things</text>
    <text x="38" y="173" class="mono" font-size="24" fill="#e9ddff" clip-path="url(#phrase-two)">useful, playful, occasionally uncanny</text>
    <text x="38" y="173" class="mono" font-size="24" fill="#e9ddff" clip-path="url(#phrase-three)">making machines feel less mechanical</text>
    <text x="700" y="173" class="mono cursor" font-size="24" fill="#b794f4">▋</text>

    <circle cx="8" cy="215" r="4" fill="#a970ff" filter="url(#soft-glow)" />
    <text x="24" y="220" class="mono" font-size="12" letter-spacing="1.8" fill="#8f86a6">UTILITY / ENTERTAINMENT / EMOTIONAL PLOT TWISTS</text>
  </g>
</svg>
