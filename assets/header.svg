<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ced2711</title>
  <desc id="desc">Profile banner for ced2711: software for everyday use, built at the University of Illinois.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d1f" />
      <stop offset="1" stop-color="#0c0914" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#b08cff" />
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.9" />
      <stop offset="0.6" stop-color="#7c5cff" stop-opacity="0.25" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>

    <clipPath id="panel">
      <rect x="0" y="0" width="1200" height="300" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .orbit { transform-origin: 980px 150px; animation: orbit 40s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
    </style>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="url(#bg)" stroke="#7c5cff" stroke-opacity="0.35" />

  <!-- left accent bar, clipped to the rounded panel -->
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)" clip-path="url(#panel)" />

  <!-- right-side geometry: three concentric rings with a single orbiting point -->
  <circle cx="980" cy="150" r="200" fill="url(#halo)" />
  <g fill="none" stroke="#9d7dff">
    <circle cx="980" cy="150" r="128" stroke-opacity="0.14" />
    <circle cx="980" cy="150" r="88" stroke-opacity="0.22" />
    <circle cx="980" cy="150" r="48" stroke-opacity="0.34" />
  </g>
  <circle cx="980" cy="150" r="5" fill="#b08cff" />
  <g class="orbit">
    <circle cx="1068" cy="150" r="4" fill="#d9c8ff" />
  </g>
  <!-- fine ticks on the outer ring -->
  <g stroke="#9d7dff" stroke-opacity="0.5">
    <line x1="980" y1="18" x2="980" y2="28" />
    <line x1="980" y1="272" x2="980" y2="282" />
    <line x1="848" y1="150" x2="858" y2="150" />
    <line x1="1102" y1="150" x2="1112" y2="150" />
  </g>

  <!-- text block -->
  <g transform="translate(72 0)">
    <text x="0" y="112" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#f1ecff">ced2711</text>
    <text x="2" y="146" class="mono" font-size="14" letter-spacing="1.2" fill="#a893e0">UNDERGRADUATE · GRAINGER COLLEGE OF ENGINEERING · UIUC</text>

    <rect x="0" y="166" width="520" height="1" fill="url(#rule)" />

    <text x="0" y="202" class="sans" font-size="20" fill="#d6cbef">Software for everyday use: desktop and mobile apps, developer tools, and AI-assisted products.</text>

    <!-- tech chips -->
    <g class="mono" font-size="12" letter-spacing="0.6" fill="#cdbdf5">
      <rect x="0" y="226" width="124" height="28" rx="14" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45" />
      <text x="62" y="244" text-anchor="middle">Kotlin · Android</text>

      <rect x="134" y="226" width="160" height="28" rx="14" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45" />
      <text x="214" y="244" text-anchor="middle">JavaScript · Electron</text>

      <rect x="304" y="226" width="80" height="28" rx="14" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45" />
      <text x="344" y="244" text-anchor="middle">Python</text>

      <rect x="394" y="226" width="104" height="28" rx="14" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45" />
      <text x="446" y="244" text-anchor="middle">Applied AI</text>
    </g>
  </g>
</svg>
