<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" role="img" aria-labelledby="title desc">
  <title id="title">Enter paper2gal</title>
  <desc id="desc">A purple glowing button linking to paper2gal.</desc>

  <defs>
    <linearGradient id="button-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171026" />
      <stop offset="1" stop-color="#0d0916" />
    </linearGradient>
    <linearGradient id="button-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.5" stop-color="#d946ef" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes shimmer { from { transform: translateX(-340px) skewX(-20deg); } to { transform: translateX(340px) skewX(-20deg); } }
      @keyframes breathe { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      .shimmer { animation: shimmer 4.8s ease-in-out infinite; }
      .edge { animation: breathe 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .shimmer, .edge { animation: none; } }
    </style>
    <clipPath id="button-clip"><rect x="1" y="1" width="258" height="50" rx="13" /></clipPath>
  </defs>

  <rect x="1" y="1" width="258" height="50" rx="13" fill="url(#button-bg)" />
  <rect class="edge" x="1" y="1" width="258" height="50" rx="13" fill="none" stroke="url(#button-edge)" stroke-width="1.5" />
  <rect class="shimmer" x="-90" y="-18" width="48" height="90" fill="#c084fc" opacity="0.12" clip-path="url(#button-clip)" />
  <circle cx="28" cy="26" r="4" fill="#c084fc" filter="url(#glow)" />
  <text x="48" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#eee7ff">enter paper2gal</text>
  <text x="228" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#b794f4">↗</text>
</svg>
